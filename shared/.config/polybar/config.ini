[colors]
background = #141413
background-alt = #242321
foreground = #ffffff
foreground-alt = #998f84
focused = #ffa724
urgent = #ff2c4b

[bar/mainbar]
monitor = ${env:MONITOR}
width = 100%
height = 34
radius = 0

background = ${colors.background}
foreground = ${colors.foreground}

border-size = 0
padding-left = 1
padding-right = 1
module-margin = 1

font-0 = Hack Nerd Font:size=16;2
font-1 = Symbols Nerd Font:size=16;2

modules-left = i3
modules-center = qutebrowser-title
modules-right = cpu memory task date

enable-ipc = true

[module/i3]
type = internal/i3
pin-workspaces = true
index-sort = true
enable-click = true
enable-scroll = false
wrapping-scroll = false
fuzzy-match = true

; Per-project icons: fuzzy-match means each line's left side just needs to be
; a substring of the workspace name, so one line covers both the yoko half
; ("6:HpbxGUI") and tate half ("6b:HpbxGUI"). Falls back to ws-icon-default
; for anything not listed yet.
ws-icon-0 = Home;
ws-icon-1 = Browser;
ws-icon-2 = Chat;
ws-icon-3 = MttAi;
ws-icon-4 = HpbxGUI;
ws-icon-5 = EqptGUI;
ws-icon-6 = TicketsGUI;
ws-icon-7 = TicketsAPI;
ws-icon-8 = Troubleshoot;
ws-icon-9 = NinjaOneAPI;󱍿
ws-icon-10 = OpenAiAPI;󰝨
ws-icon-11 = GoogleAiAPI;󰊭
ws-icon-12 = AmiReplication;
ws-icon-13 = RecordingFileMonitor;
ws-icon-14 = VoicemailFileMonitor;
ws-icon-15 = MttCRM;
ws-icon-16 = SipUtils;
ws-icon-17 = CallRecording;󰻂
ws-icon-18 = Troubleshoot 2;
ws-icon-19 = AmiSocket;󰌘
ws-icon-default =

label-focused = %icon% %name%
label-focused-background = ${colors.background-alt}
label-focused-foreground = ${colors.focused}
label-focused-underline = ${colors.focused}
label-focused-padding = 2

label-unfocused = %icon% %name%
label-unfocused-foreground = ${colors.foreground-alt}
label-unfocused-padding = 2

label-visible = %icon% %name%
label-visible-foreground = ${colors.foreground}
label-visible-padding = 2

label-urgent = %icon% %name%
label-urgent-background = ${colors.urgent}
label-urgent-foreground = ${colors.background}
label-urgent-padding = 2

[module/cpu]
type = internal/cpu
interval = 2
label =  %percentage%%
label-foreground = ${colors.foreground-alt}

[module/memory]
type = internal/memory
interval = 2
label =  %percentage_used%%
label-foreground = ${colors.foreground-alt}

[module/task]
type = custom/script
exec = task rc.verbose=nothing count status:pending 2>/dev/null
interval = 30
label =  %output%
label-foreground = ${colors.foreground-alt}
click-left = ~/.config/i3/scripts/toggle-todo.sh

[module/date]
type = internal/date
interval = 60
date = %Y-%m-%d
label =  %date%
label-foreground = ${colors.foreground}

[module/qutebrowser-title]
type = custom/script
exec = ~/.config/polybar/scripts/qutebrowser-title.sh
interval = 20
label =  %output%
label-foreground = ${colors.foreground-alt}

[bar/mainbar-tate]
inherit = bar/mainbar
bottom = true
modules-center =
modules-right = cpu memory task
font-0 = Hack Nerd Font:size=12;2
font-1 = Symbols Nerd Font:size=12;2

[settings]
screenchange-reload = true
